# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/msi-builder/main/pkg/config/schema.json
# Converted from implicit.wxs by msi-builder convert.
# Review it, resolve the TODO comments, then run msi-builder validate.
# convert computed the guids of 3 components whose code WiX generates from their key paths, as wix build for any -arch does; with --msi and the package WiX built, it takes them from that package instead.
schema: msi-builder/v1
product:
  name: Hello
  manufacturer: Example
  version: 1.0.0
  upgradeCode: 0b7e8c41-2f6d-4a39-8c15-7d2e9f0a6b54
package:
  platform: x64
upgrade:
  allowSameVersion: false
  downgradeMessage: A newer version is installed.
installDir:
  # WiX ID Hello_Dir; the install folder must be an upper-case public property,
  # so every [Hello_Dir] reference became [HELLO_DIR].
  id: HELLO_DIR
  name: Hello
features:
  - id: Main
    title: Hello
    components: [Spy, Links, hello.exe, Component1, Component2, StartMenu]
  - id: Docs
    title: Documentation
    components: [TxtAssoc, readme.txt]
components:
  # A Subdirectory is not the install folder.
  - id: Spy
    directory: spy
    guid: '{8AB47247-ED44-5409-810A-C6759884172E}'
    files:
      - source: dist/spy.dll
  # A Subdirectory below a standard folder that no element declares.
  - id: Links
    directory: ProgramMenuFolder/Hello Project
    shortcuts:
      - name: Hello website
        url: https://example.com
        directory: ProgramMenuFolder/Hello Project
  # A shortcut to a file of another component stays here.
  # The RemoveFolder and HKCU key path of this shortcut component were left out:
  # msi-builder writes both for every shortcut.
  - id: StartMenu
    directory: ProgramMenuFolder/Hello Project
    shortcuts:
      # TODO(line 24): the shell property {12345678-1234-1234-1234-123456789ABC}, 2 was left out: write it by its canonical name, such as System.AppUserModel.ID
      - name: Hello
        file: hello.exe
        directory: ProgramMenuFolder/Hello Project
        properties:
          System.AppUserModel.ID: Example.Hello
  # An optional file association for a file of another feature.
  - id: TxtAssoc
    guid: 6a0f1c2e-7d3b-4e58-9a61-2b4c8d0e1f38
    fileTypes:
      - progId: Example.HelloText
        file: hello.exe
        description: Hello text
        extensions:
          - extension: hellotxt
        verbs:
          - id: open
            arguments: '"%1"'
  - id: hello.exe
    guid: '{78693E13-BDFA-5DDB-ACF6-13E143D638A9}'
    files:
      - source: dist/hello.exe
        id: hello.exe
  - id: Component1
    directory: tools
    files:
      - source: dist/tools/
        exclude: ['**/*.pdb', debug/*]
  - id: Component2
    files:
      - source: dist/LICENSE.txt
  - id: readme.txt
    guid: '{7BB5105A-DE93-5841-9AD1-7B9AAC98F6BC}'
    files:
      - source: dist/readme.txt
