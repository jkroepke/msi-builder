# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/msi-builder/main/pkg/config/schema.json
# Converted from dualscope.wxs by msi-builder convert.
# Review it, resolve the TODO comments, then run msi-builder validate.
# TODO(line 63): the standard action RemoveExistingProducts in InstallExecuteSequence runs only when NOT UPGRADINGPRODUCTCODE; msi-builder schedules the standard actions itself, without conditions
# TODO(line 27): the action OverridePerMachineFolder, which sets WixPerMachineFolder for WixUI_Advanced, was left out: msi-builder sets the install folder of each scope itself
# TODO(line 31): the action OverrideAgain, which sets WixPerMachineFolder for WixUI_Advanced, was left out: msi-builder sets the install folder of each scope itself
# TODO(line 47): the action SetAllUsersFromPrevious, which sets ALLUSERS, was left out: a perUserOrMachine package sets ALLUSERS and MSIINSTALLPERUSER itself, and the scope page or the command line picks the context; components[].scope keeps components in one context (INST-07)
# TODO: the sequence moves the standard action FindRelatedProducts in ui, which msi-builder cannot take (the wizard's scope page runs it after the context is chosen); convert left the move out
# TODO(line 53): the sequence moves the standard action AppSearch in ui, which msi-builder cannot take (the wizard's scope page runs FindRelatedProducts after costing); convert left the move out
vars:
  MainLevel: "1"
---
schema: msi-builder/v1
product:
  name: Hello
  manufacturer: Example
  version: 1.0.0
  upgradeCode: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
package:
  # TODO(line 5): WiX takes the platform from wix build -arch; check package.platform
  platform: x64
  scope: perUserOrMachine
upgrade:
  allowSameVersion: false
  downgradeMessage: newer
installDir:
  id: INSTALLFOLDER
  # TODO(line 26): several actions set WixPerMachineFolder; set installDir.parent and name to the folder the last one sets
  name: Hello
features:
  - id: DefaultFeature
    directory: INSTALLFOLDER
    allowAbsent: false
    components: [hello.exe, Component1, Component2, Component3]
components:
  - id: hello.exe
    files:
      - source: hello.exe
  - id: Component1
    registry:
      - root: HKLM
        key: Software\Example\Hello
        name: InstalledBy
        value: msi
    environment:
      - name: PATH
        value: '[INSTALLFOLDER]'
        action: append
        scope: machine
    scope: perMachine
  - id: Component2
    registry:
      - root: HKLM
        key: Software\Example\Hello
        name: Machine
        value: "1"
    scope: perMachine
  - id: Component3
    registry:
      - root: HKCU
        key: Software\Example\Hello
        name: u
        value: "1"
    environment:
      - name: PATH
        value: '[INSTALLFOLDER]'
        action: append
        scope: user
    scope: perUser
properties:
  # Look for older versions in the context of the previous install:
  # FindRelatedProducts only finds products in the current one.
  PREVMACHINE:
    search:
      registry:
        root: HKLM
        key: Software\Example\Hello
        name: Machine
customActions:
  # Elevated actions run only per machine in msi-builder (CA-09).
  - id: RegisterMachine
    run:
      command: '"[INSTALLFOLDER]hello.exe" --register'
      directory: INSTALLFOLDER
    execute: deferred
    impersonate: false
    # TODO(line 36): msi-builder runs an action without impersonation in a perUserOrMachine package only in per-machine installs (CA-09), so it adds ALLUSERS=1 to the schedule; check that RegisterMachine still runs when it should
    scope: perMachine
    return: check
    schedule:
      - {sequence: execute, after: InstallFiles, condition: NOT Installed}
  - id: RegisterGuarded
    run:
      command: '"[INSTALLFOLDER]hello.exe" --guarded'
      directory: INSTALLFOLDER
    execute: deferred
    impersonate: false
    scope: perMachine
    return: check
    schedule:
      - {sequence: execute, after: InstallFiles}
  - id: ElevatedUser
    run:
      command: '"[INSTALLFOLDER]hello.exe" --elevated-user'
      directory: INSTALLFOLDER
    execute: deferred
    # TODO(line 38): ElevatedUser runs only per user; in the per-user installs CA-09 tested, a standard user's and an administrator's, an action without impersonation ran as the installing user, so it runs impersonated; a per-user install elevated by policy (AlwaysInstallElevated) was not tested
    scope: perUser
    return: check
    schedule:
      - {sequence: execute, after: InstallFiles}
  - id: SetupUser
    run:
      command: '"[INSTALLFOLDER]hello.exe" --user'
      directory: INSTALLFOLDER
    execute: deferred
    scope: perUser
    return: check
    schedule:
      - {sequence: execute, after: InstallFiles}
  # Scheduled in the UI sequence too, so it keeps its conditions.
  - id: SetMode
    setProperty: {name: HELLOMACHINE, value: "1"}
    schedule:
      - {sequence: ui, after: CostFinalize, condition: ALLUSERS=1}
      - {sequence: execute, after: CostFinalize, condition: ALLUSERS=1}
  # Placed on left-out setters, so they move to those setters' place.
  - id: SetHELLOMODE
    setProperty: {name: HELLOMODE, value: dual}
    # TODO(line 33): WixSetDefaultPerMachineFolder is an action of a WiX extension, which the msi-builder package does not have; convert placed this action after CostFinalize, check that place
    schedule:
      - {sequence: execute, after: CostFinalize}
  - id: SetUIMODE
    setProperty: {name: UIMODE, value: dual}
    # TODO(line 34): WixSetDefaultPerMachineFolder is an action of a WiX extension, which the msi-builder package does not have; convert placed this action after CostFinalize, check that place
    schedule:
      # TODO(line 31): SetUIMODE was scheduled next to OverrideAgain, which is not in the ui sequence; convert placed it after CostFinalize, check that place
      - {sequence: ui, after: CostFinalize}
      - {sequence: execute, after: CostFinalize}
standardActions:
  - action: FindRelatedProducts
    schedule:
      - {sequence: execute, after: AppSearch}
ui:
  enabled: true
  chooseFeatures: true
  chooseDirectory: true
