# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/msi-builder/main/pkg/config/schema.json
# Converted from remember.wxs by msi-builder convert.
# Review it, resolve the TODO comments, then run msi-builder validate.
schema: msi-builder/v1
product:
  name: Hello
  manufacturer: Example
  version: 1.0.0
  upgradeCode: '{0B7C3D2E-5F41-4A6B-8C9D-1E2F3A4B5C6D}'
  description: Hello edition
package:
  platform: x64
  scope: perUser
  installerVersion: "5.0"
upgrade:
  allowSameVersion: false
  downgradeMessage: A newer version of [ProductName] is already installed.
installDir:
  # WiX ID AppDataHello; the install folder must be an upper-case public property,
  # so every [AppDataHello] reference became [APPDATAHELLO].
  id: APPDATAHELLO
directories:
  - id: LocalAppDataFolder
    children:
      - id: AppDataExample
        name: Example
        children:
          - id: APPDATAHELLO
            name: Hello
            configurable: true
features:
  - id: Complete
    components: [MainExecutable, CleanupData, CleanupCache]
components:
  - id: MainExecutable
    guid: '{1C2D3E4F-5061-4728-9A3B-4C5D6E7F8091}'
    files:
      - source: hello.exe
  - id: CleanupData
    directory: AppDataExample
    guid: '{2D3E4F50-6172-4839-AB4C-5D6E7F809102}'
    registry:
      - root: HKCU
        key: Software\Example\Hello
        name: DataPath
        value: '[AppDataExample]'
    purge: true
  # Removes a folder that the component does not remember.
  # TODO(line 42): util:RemoveFolderEx On="install" on AppDataExample was not converted: removeFolders removes a folder of the package on uninstall only, since a repair would lose the files the installer keeps there
  - id: CleanupCache
    directory: AppDataExample
    guid: '{3E4F5061-7283-494A-BC5D-6E7F80910213}'
    registry:
      - root: HKCU
        key: Software\Example\Hello
        name: Cache
        value: '[AppDataExample]'
    removeFolders:
      - property: CACHEPATH
properties:
  # The data folder that the uninstall removes.
  DATAPATH:
    search:
      registry:
        root: HKCU
        key: Software\Example\Hello
        name: DataPath
  CACHEPATH:
    search:
      registry:
        root: HKCU
        key: Software\Example\Hello
        name: CachePath
