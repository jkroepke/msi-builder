# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/msi-builder/main/pkg/config/schema.json
# Converted from fragments.wxs by msi-builder convert.
# Review it, resolve the TODO comments, then run msi-builder validate.
# WiX variables became template variables; pass them with --var NAME=value: ProductName.
# TODO(line 5): <?if $(var.Edition) = "full"?> is not evaluated: only its first branch was converted
# TODO(line 7): the <?else?> branch was left out; convert it by hand if your build takes it
# TODO(line 52): <?if $(var.Arch) = "arm64"?> is not evaluated: only its first branch was converted
# TODO(line 54): the <?else?> branch was left out; convert it by hand if your build takes it
# TODO(line 51): the extension attributes util:Extra on <Component> have no counterpart
# TODO(line 65): advertised shortcuts are never supported; this one is a plain shortcut
# TODO(line 65): the shortcut "Hello Help" has no Target: advertised shortcuts are never supported; point it at a file
vars:
  Greeting: Hello
---
schema: msi-builder/v1
product:
  name: {{ .ProductName | quote }}
  manufacturer: Example
  version: 1.0.0
  upgradeCode: 5d9b2f3a-7c1e-4b8d-9f0a-2e6c4a8b1d37
package:
  platform: x64
# TODO(line 38): an UpgradeVersion for the package's own UpgradeCode (versions 0.0.1 to 1.0.0) is a hand-made major upgrade; msi-builder writes its own, which removes every older version (down to upgrade.minVersion) and never a newer one (downgrade: allow installs next to a newer version), check the upgrade keys
installDir:
  id: INSTALLFOLDER
  name: Hello
features:
  - id: Main
    title: Hello
    components: [PluginA, MainExe, Notes]
    features:
      - id: Samples
        title: Samples
        default: off
        components: [SampleFile]
components:
  - id: PluginA
    directory: plugins
    files:
      - source: dist/plugins/a.dll
        id: plugin_a.dll
  - id: MainExe
    files:
      - source: dist/arm64/hello.exe
        id: hello.exe
  - id: Notes
    files:
      - source: dist/notes.txt
        id: notes.txt
  - id: SampleFile
    files:
      - source: dist/sample.txt
        id: sample.txt
properties:
  # Installs the level 2 features by default.
  INSTALLLEVEL: "2"
  GREETING: {{ print .Greeting `, welcome to ` .ProductName | quote }}
