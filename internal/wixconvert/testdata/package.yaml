# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/msi-builder/main/pkg/config/schema.json
# Converted from package.wxs by msi-builder convert.
# Review it, resolve the TODO comments, then run msi-builder validate.
# WiX variables became template variables; pass them with --var NAME=value: Version.
# TODO(line 7): <?include common.wxi?>: convert the included file and merge it in by hand
# TODO(line 48): the hand-built dialog PortDlg cannot be converted; ui.dialogs lays out text, password, checkbox and choice fields
# TODO(line 169): <util:RestartResource> outside a component registers its resource on every install; add it to restartResources of the component it belongs to, which registers it when that component is installed, repaired or removed
# TODO(line 171): <util:CloseApplication> for hello.exe only detects the running program (Property HELLORUNNING), which has no counterpart; files[].close on the program's file closes it instead
# TODO(line 188): rescheduling the standard action RemoveExistingProducts in InstallExecuteSequence has no counterpart
# TODO(line 51): a second progress text for InstallFiles is ignored
# TODO(line 178): the custom action Greet is a script; script custom actions are never supported, use a run action
# TODO(line 179): the custom action ConfigureIIS calls the WiX extension Wix4IIsCA_X64!ConfigureIIs, which has no counterpart
# TODO(line 50): the progress text of InstallFiles cannot be converted: msi-builder writes progress texts only for its customActions
# TODO(line 52): the progress text of LaunchHello is dropped: the action was not converted to a customActions entry of its own
# TODO(line 190): drop Wix4BroadcastEnvironmentChange_X64: Windows Installer announces environment changes itself
# TODO(line 191): Wix4BroadcastSettingChange_X64 has no counterpart; if the package writes a setting that Windows reads only on WM_SETTINGCHANGE, send it from a run action
vars:
  Port: "8080"
  ShortName: Hello
  ShortcutName: Hello App
---
schema: msi-builder/v1
product:
  name: Hello
  manufacturer: Example
  version: {{ .Version | quote }}
  language: 1031
  upgradeCode: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
  description: Hello service
  arp:
    icon: hello.ico
    helpLink: https://example.com/help
    noModify: true
package:
  platform: x64
  installerVersion: "4.5"
  codepage: 1252
  summary:
    keywords: hello,service
upgrade:
  # TODO(line 15): WiX generated the Guid of manual.pdf, hello.yaml; msi-builder generates other codes, and removing the old version after installing this one deletes their files on the first upgrade from the WiX package. Run msi-builder convert again with --msi and the package WiX built, or set each guid from msi-builder inspect --table Component
  removeOld: afterInstallExecute
  downgrade: allow
  downgradeMessage: A newer version of Hello is already installed.
  ignoreRemoveFailure: true
  related:
    - upgradeCode: 513044d7-fae5-4715-984a-14f911d06fcc
      minVersion: 1.0.0
      maxVersion: {{ .Version | quote }}
      includeMin: false
      property: OLDX86FOUND
  property: WIX_UPGRADE_DETECTED
installDir:
  id: INSTALLFOLDER
  # util:RemoveFolderEx needs the install dir chosen at install time; remember searches for it.
  remember: true
directories:
  - id: ProgramFiles64Folder
    children:
      - id: INSTALLFOLDER
        name: Hello
        configurable: true
        children:
          - id: LogsDir
            name: {{ print .ShortName ` logs` | quote }}
  - id: CommonAppDataFolder
    children:
      - id: DataDir
        name: Hello
features:
  - id: Main
    title: Hello
    directory: INSTALLFOLDER
    allowAbsent: false
    components: [HelloExe, hello.yaml, Logs, Data, StartMenu]
    features:
      - id: Docs
        title: Documentation
        # TODO(line 74): the conditional level "5" with condition "&Main = 3" was not converted: a feature condition cannot ask for feature or component states (&Main)
        default: off
        conditions:
          - condition: INSTALLDOCS = 1
            default: on
        display: expanded
        components: [manual.pdf]
  - id: Firewall
    title: Firewall rule
    level: 3
    components: [FirewallRule]
components:
  - id: manual.pdf
    files:
      - source: docs/manual.pdf
  # TODO(line 102): <util:RestartResource> ProcessName hello-tray.exe matches every program of that name; restartResources program takes its full path so that copies elsewhere are left alone; Restart Manager is expected to shut down programs that run from a file the installation replaces or removes
  # TODO(line 129): <util:XmlFile> is not supported: ship the complete file, or edit it with a run action (no rollback)
  - id: HelloExe
    guid: 0b7e6b4e-6c1a-4c55-9e43-3b8f3c0d6a10
    files:
      - source: bin/hello.exe
        id: hello.exe
        checksum: true
        shortcuts:
          - name: {{ .ShortcutName | quote }}
            directory: DesktopFolder
            arguments: --gui
        fileTypes:
          - progId: Example.HelloDoc
            description: Hello document
            iconIndex: 1
            extensions:
              - extension: hello
                contentType: application/x-hello
            verbs:
              - id: open
                text: Open with Hello
                arguments: '"%1"'
          # TODO(line 111): <MIME> in an Extension has no counterpart
          - progId: Example.HelloVault
            description: Hello vault
            iconIndex: 2
            extensions:
              - extension: hellovault
                contentType: application/x-hello-vault
            verbs: []
        # TODO(line 168): close of bin/hello.exe in INSTALLFOLDER came from <util:CloseApplication>: WiX matches the running program by its file name, close by its installed path
        close: {terminate: false}
    registry:
      - root: HKLM
        key: SOFTWARE\Example\Hello
        type: key
        removeOnUninstall: true
      - root: HKLM
        key: SOFTWARE\Example\Hello
        name: InstallDir
        value: '[INSTALLFOLDER]'
      - root: HKLM
        key: SOFTWARE\Example\Hello
        name: Port
        type: dword
        value: {{ .Port | quote }}
      - root: HKLM
        key: SOFTWARE\Example\Hello
        name: Hosts
        type: multiString
        value: [localhost, example.com]
      - root: HKLM
        key: SOFTWARE\Example\Hello\Plugins
        type: key
    removeRegistry:
      - root: HKLM
        key: SOFTWARE\Example\HelloOld
      - root: HKCU
        key: Software\Example\Hello
        name: Window
    services:
      - name: Hello
        displayName: Hello Service
        description: Answers hello requests.
        start: auto
        delayedAutoStart: true
        vital: true
        account: NT AUTHORITY\NetworkService
        arguments: --port [PORT]
        dependencies: [Tcpip]
        control:
          wait: false
        # TODO(line 94): the recovery action "reboot" has no counterpart; restart and none are supported
        recovery:
          resetAfterDays: 1
          actions: [restart, restart, none]
          restartDelay: 120s
        permissions:
          grant:
            - account: BU
              rights: [start, stop]
    serviceControl:
      - name: HelloLegacy
        stopOnInstall: true
        deleteOnInstall: true
    eventLog:
      - source: Hello
        log: Application
        messageFile: '[#hello.exe]'
        typesSupported: 5
    environment:
      - name: PATH
        value: '[INSTALLFOLDER]'
        action: append
        scope: machine
    restartResources:
      # Programs that keep the shared state file open.
      - file: '[CommonAppDataFolder]Example\Hello\state.db'
      - service: HelloHelper
  - id: hello.yaml
    directory: config
    files:
      - source: config/hello.yaml
        id: hello.yaml
    permanent: true
    neverOverwrite: true
  # TODO(line 136): the install half of util:RemoveFolderEx On="both" on INSTALLFOLDER was not converted: removeFolders removes a folder of the package on uninstall only, since a repair would lose the files the installer keeps there
  - id: Logs
    directory: LogsDir
    guid: 0b7e6b4e-6c1a-4c55-9e43-3b8f3c0d6a12
    removeFiles:
      - name: '*.log'
    removeFolders:
      - property: INSTALLFOLDER
    # TODO(line 138): <Permission> replaces the object's permissions; write them as an SDDL string in folderPermissions.sddl and add (A;OICI;FA;;;SY): Windows Installer also gives SYSTEM full access to an object it locks
    createFolder: true
  - id: Data
    directory: DataDir
    guid: 0b7e6b4e-6c1a-4c55-9e43-3b8f3c0d6a13
    registry:
      - root: HKLM
        key: SOFTWARE\Example\Hello
        name: DataDir
        value: '[DataDir]'
    purge: true
    createFolder: true
    folderPermissions:
      grant:
        - account: NS
          rights: [full]
        - account: BU
          rights: ["0x120116"]
  # The RemoveFolder and HKCU key path of this shortcut component were left out:
  # msi-builder writes both for every shortcut.
  # TODO(line 151): msi-builder writes its own HKCU key path for this shortcut component; with the late removeOld the WiX value HKCU\Software\Example\Hello\installed stays behind after the upgrade and the uninstall, so remove it with removeRegistry in another component
  - id: StartMenu
    directory: ProgramMenuFolder/Example
    guid: 0b7e6b4e-6c1a-4c55-9e43-3b8f3c0d6a14
    shortcuts:
      - name: Hello
        program: '[INSTALLFOLDER]hello.exe'
        directory: ProgramMenuFolder/Example
        description: Say hello
        workingDirectory: INSTALLFOLDER
      - name: Hello website
        url: https://example.com
        directory: ProgramMenuFolder/Example
  - id: FirewallRule
    guid: 0b7e6b4e-6c1a-4c55-9e43-3b8f3c0d6a15
properties:
  PORT: {{ .Port | quote }}
  API_TOKEN:
    hidden: true
  # The folder of the last version.
  OLD_INSTALLDIR:
    search:
      registry:
        root: HKLM
        key: SOFTWARE\Example\Hello
        name: InstallDir
        bitness: "64"
        type: directory
  TOOL_PATH:
    search:
      file:
        name: tool.exe
        minVersion: "2.0"
        under:
          directory:
            path: '[ProgramFiles64Folder]Example\Tools'
            depth: 2
launchConditions:
  - condition: Installed OR VersionNT64
    message: Hello needs 64-bit Windows.
customActions:
  - id: StopClients
    run:
      command: '"[#hello.exe]" detach --all'
    execute: deferred
    impersonate: false
    return: ignore
    progress: {{ print `Stopping the hello ` .Version ` clients` | quote }}
    schedule:
      - {sequence: execute, before: StopServices, when: uninstall}
  - id: ImportData
    run:
      command: '"[#hello.exe]" import'
    execute: deferred
    impersonate: false
    return: check
    schedule:
      - {sequence: execute, after: InstallFiles, when: install}
  - id: CheckLicense
    dll: {binary: HelperDll, entry: CheckLicense}
    return: check
    schedule:
      - {sequence: execute, after: CostFinalize}
  - id: RunSetupTool
    exe:
      binary: SetupTool
      arguments: /quiet
    execute: deferred
    impersonate: false
    return: check
    schedule:
      - {sequence: execute, after: InstallFiles, when: upgrade}
  - id: NoX86
    error: Hello does not install on 32-bit Windows.
    schedule:
      - {sequence: execute, before: LaunchConditions, condition: NOT VersionNT64}
  # Runs in the UI sequence, or in the execute sequence of a quiet install.
  - id: SetHELLO_EDITION
    setProperty: {name: HELLO_EDITION, value: full}
    once: firstSequence
    schedule:
      - {sequence: ui, after: AppSearch}
      - {sequence: execute, after: AppSearch}
  - id: SetHELLO_ARGS
    setProperty: {name: HELLO_ARGS, value: '--config "[#hello.yaml]"'}
    schedule:
      - {sequence: execute, before: InstallFiles, condition: NOT HELLO_ARGS}
  - id: SetLogsDir
    setDirectory: {directory: LogsDir, value: '[%SYSTEMROOT]\Temp\Hello'}
    schedule:
      - {sequence: execute, after: CostFinalize}
icons:
  hello.ico: assets/hello.ico
binaries:
  HelperDll: bin/helper.dll
  SetupTool: bin/setup-tool.exe
firewall:
  - name: Hello
    component: FirewallRule
    program: '[#hello.exe]'
    protocol: tcp
    port: '[PORT]'
    remoteAddresses: LocalSubnet
    profiles: all
scheduleReboot:
  condition: NOT Installed
ui:
  enabled: true
  license: assets/license.rtf
  chooseDirectory: true
  launch:
    file: hello.exe
    text: Start Hello
    checked: false
  theme:
    banner: assets/banner.bmp
