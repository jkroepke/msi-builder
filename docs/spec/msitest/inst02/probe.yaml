vars:
  SCOPE: perUserOrMachine
  VERSION: 1.0.0
---
schema: msi-builder/v1

product:
  name: ScopeProbe
  manufacturer: MsiSpecProbe
  version: '{{ .VERSION }}'
  upgradeCode: 6a0d7f52-2c1e-4b8e-9d33-51f4a0c7e912

package:
  platform: x64
  scope: '{{ .SCOPE }}'

ui:
  enabled: false

components:
  - files:
      - source: hello.exe
        shortcuts:
          - description: Scope probe
    registry:
      - { root: HKMU, key: Software\MsiSpecProbe\ScopeProbe, name: Mu, value: "[INSTALLDIR]" }
      - { root: HKCR, key: MsiSpecScopeProbe.File, name: Cr, value: probe }

customActions:
  - id: ProbeBefore
    setProperty: { name: PROBEBEFORE, value: "PF=[ProgramFiles64Folder] DIR=[INSTALLDIR] MENU=[ProgramMenuFolder] AU=[ALLUSERS] PU=[MSIINSTALLPERUSER] PRIV=[Privileged]" }
    schedule:
      - { sequence: ui, after: CostFinalize }
      - { sequence: execute, after: CostFinalize }
  - id: ProbeSwitchAU
    setProperty: { name: ALLUSERS, value: "[PROBE_AU]" }
    schedule:
      - { sequence: ui, after: ProbeBefore, condition: PROBE_SWITCH }
  - id: ProbeSwitchPU
    setProperty: { name: MSIINSTALLPERUSER, value: "[PROBE_PU]" }
    schedule:
      - { sequence: ui, after: ProbeSwitchAU, condition: PROBE_SWITCH }
  - id: ProbeAfter
    setProperty: { name: PROBEAFTER, value: "PF=[ProgramFiles64Folder] DIR=[INSTALLDIR] MENU=[ProgramMenuFolder] AU=[ALLUSERS] PU=[MSIINSTALLPERUSER] PRIV=[Privileged]" }
    schedule:
      - { sequence: ui, after: ProbeSwitchPU }
