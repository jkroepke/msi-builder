# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/msi-builder/main/pkg/config/schema.json
# windows_exporter, the reference package and first acceptance test.
#
#   msi-builder build --var VERSION=0.32.0.5 --var ARCH=x64 \
#     --var BINARY=windows_exporter.exe -o windows_exporter-0.32.0.5-amd64.msi msi.yaml
vars:
  ARCH: x64
  BINARY: windows_exporter.exe
  ICON: icon.ico
---
schema: msi-builder/v1

product:
  name: windows_exporter
  manufacturer: prometheus-community
  version: '{{ .VERSION }}'
  upgradeCode: 66a6eb5b-1fc2-4b14-a362-5ceec6413308
  arp:
    icon: icon.ico
    comments: Prometheus exporter for Windows machines
    helpLink: https://github.com/prometheus-community/windows_exporter/issues
    aboutLink: https://github.com/prometheus-community/windows_exporter
    noRepair: true
    size: 10000
    installLocation: APPLICATIONFOLDER

package:
  platform: '{{ .ARCH }}'
  cabinet: windows_exporter.cab

# C:\Program Files\windows_exporter. APPLICATIONFOLDER is the property the
# released packages use for it.
installDir:
  id: APPLICATIONFOLDER
  name: windows_exporter

features:
  - id: DefaultFeature
    title: windows_exporter {{ .VERSION }}
    description: The binary and configuration files for windows_exporter
    display: expanded
    directory: APPLICATIONFOLDER
    allowAbsent: false
    components:
      - id: Executable
        # The GUID of the released packages, the same on amd64 and arm64.
        guid: 5546455E-B5EA-5AF8-A21A-AA526F04D083
        transitive: true
        files:
          - source: '{{ .BINARY }}'
            name: windows_exporter.exe
            checksum: true
            # ServiceControl stops the service, but its process can outlive
            # STOPPED and hold the binary. close ends it before RemoveFiles,
            # only processes that run this installation's binary, so a copy
            # elsewhere or a Kubernetes HostProcess container keeps running.
            close: true
        services:
          - name: windows_exporter
            description: Exports Prometheus metrics about the system
            delayedAutoStart: true
            vital: true
            account: '[SERVICE_ACCOUNT]'
            password: '[SERVICE_PASSWORD]'
            # Each piece is only added when its condition is true.
            arguments:
              - value: --config.file="[APPLICATIONFOLDER]config.yaml"
                condition: CONFIG_FILE="config.yaml"
              - value: --config.file="[CONFIG_FILE]"
                condition: CONFIG_FILE AND CONFIG_FILE<>"config.yaml"
              - value: --collectors.enabled [ENABLED_COLLECTORS]
                condition: ENABLED_COLLECTORS
              - value: --web.listen-address="[LISTEN_ADDR]:[LISTEN_PORT]"
                condition: LISTEN_ADDR<>"" OR LISTEN_PORT<>9182
              - value: --telemetry.path="[METRICS_PATH]"
                condition: METRICS_PATH
              - value: --collector.textfile.directories="[TEXTFILE_DIRS]"
                condition: TEXTFILE_DIRS
              - '[EXTRA_FLAGS]'
            dependencies: [wmiApSrv]
            failureActionsOnNonCrashFailures: true
            # Start without waiting, like the released packages: a service
            # that cannot start (a bad flag or config) leaves the install
            # in place with the service stopped instead of rolling it back.
            # Stopping still waits, so files are not replaced while it runs.
            control:
              waitForStart: false
            recovery:
              actions: [restart, restart, restart]
              restartDelay: 60s
        eventLog:
          # The exporter calls eventlog.Open("windows_exporter").
          - source: windows_exporter
            messageFile: '%SystemRoot%\System32\EventCreate.exe'

      - directory: textfile_inputs
        guid: D03EF58A-9CBF-4165-AD39-D143E9B27E14
        createFolder: true

    features:
      - id: FirewallException
        title: Firewall Exception
        description: Allow windows_exporter to listen on a port
        default: off
        display: expanded
        firewall:
          - name: windows_exporter
            description: windows_exporter HTTP endpoint
            program: '[#windows_exporter.exe]'
            protocol: tcp
            port: '[LISTEN_PORT]'
            remoteAddresses: '[REMOTE_ADDR]'
            profiles: all

properties:
  ENABLED_COLLECTORS: {}
  EXTRA_FLAGS: {}
  CONFIG_FILE: config.yaml
  LISTEN_ADDR: {}
  LISTEN_PORT: "9182"
  METRICS_PATH: {}
  TEXTFILE_DIRS: {}
  REMOTE_ADDR: {}
  SERVICE_ACCOUNT: {}
  SERVICE_PASSWORD: { hidden: true }
  # Turns Restart Manager off (msi-builder leaves it on by default): in a
  # silent install it shuts down every process holding a package file, also
  # monitoring tools that only have the exporter open. ServiceControl and
  # close already stop this installation.
  MSIRESTARTMANAGERCONTROL: Disable

customActions:
  # Rerunning the MSI on an installed product reinstalls everything.
  - id: SetMaintenance
    setProperty: { name: MAINTENANCE, value: "true" }
    schedule:
      - { sequence: execute, before: SetReinstallAll, condition: Installed AND (NOT REMOVE) AND (NOT UPGRADINGPRODUCTCODE) }
  - id: SetReinstallAll
    setProperty: { name: REINSTALL, value: ALL }
    schedule:
      - { sequence: execute, before: SetReinstallMode, condition: MAINTENANCE }
  - id: SetReinstallMode
    setProperty: { name: REINSTALLMODE, value: amus }
    schedule:
      - { sequence: execute, before: LaunchConditions, condition: MAINTENANCE }

  - id: CheckExtraFlags
    error: The parameter '--config.file' must not be included in EXTRA_FLAGS. Use CONFIG_FILE instead. Please remove it and try again.
    schedule:
      - { sequence: execute, before: InstallInitialize, condition: EXTRA_FLAGS AND (EXTRA_FLAGS >< "--config.file") }

  # config.yaml is not owned by a component, so it survives upgrades and
  # uninstall. Only while the executable is installed or reinstalled: on
  # removal, CONFIG_FILE falls back to its default, and when config.yaml was
  # never created (a custom CONFIG_FILE) or was deleted, the empty folder is
  # already gone. Starting the command there fails with error 267
  # (MSISPEC-RESULTS, run 40334482129) and fails the uninstall.
  - id: CreateConfigFile
    run:
      command: '"[%ComSpec]" /c TYPE NUL >>"[APPLICATIONFOLDER]config.yaml"'
      directory: APPLICATIONFOLDER
    execute: deferred
    impersonate: false
    return: check
    progress: Creating the configuration file
    schedule:
      - { sequence: execute, before: InstallServices, condition: CONFIG_FILE="config.yaml" AND $Executable=3 }

icons:
  icon.ico: '{{ .ICON }}'

ui:
  enabled: true
  chooseFeatures: true
  dialogs:
    - id: ConfigDlg
      title: windows_exporter configuration
      description: This page contains configuration related to windows_exporter
      after: CustomizeDlg
      fields:
        - property: ENABLED_COLLECTORS
          label: >-
            Comma-separated list of collectors to use. Use '[\[]defaults[\]]' as a placeholder for all
            the collectors enabled by default. If value is empty, the exporter default will be used.
        - property: EXTRA_FLAGS
          label: Additional command line flags
        - property: LISTEN_PORT
          label: Port to listen
        - property: CONFIG_FILE
          label: >-
            Path to config file. If empty, no config will be used. If set to 'config.yaml',
            then the config.yaml at the install path will be used.
