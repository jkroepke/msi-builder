# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/msi-builder/main/pkg/config/schema.json
# A desktop program with a license, a page to pick the install folder, a
# note and a check box on the finish page that starts the program, and
# shortcuts in the Start menu and on the desktop.
#
#   msi-builder build --var VERSION=2.0.0 -o example-viewer.msi msi.yaml
#
# The input files sit next to this file: viewer.exe and LICENSE.txt (plain
# text, converted to RTF).
schema: msi-builder/v1

product:
  name: Example Viewer
  manufacturer: Example
  version: '{{ .VERSION }}'
  upgradeCode: 7c1e4b52-93a0-4d6f-8e25-b4f0a9d3c871

package:
  platform: x64

# C:\Program Files\Example Viewer, shown on the install folder page.
installDir:
  name: Example Viewer

components:
  - files:
      - source: viewer.exe
        shortcuts:
          # Start menu > Programs > Example Viewer.
          - description: View example files
          - directory: DesktopFolder
    # Version 1 kept its settings under another key; drop them on install.
    removeRegistry:
      - { root: HKLM, key: SOFTWARE\Example\Viewer 1 }

properties:
  # The theme an earlier install recorded, "light" when there is none; a
  # command-line THEME=... wins over both.
  THEME:
    value: light
    search:
      registry: { root: HKLM, key: SOFTWARE\Example\Viewer, name: Theme }

ui:
  enabled: true
  license: LICENSE.txt
  chooseDirectory: true
  # A paragraph on the finish page after a new installation.
  finishText: Start [ProductName] from the Start menu or the desktop shortcut.
  launch:
    file: viewer.exe
