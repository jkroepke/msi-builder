name: Probe

# Runs only the Windows probe this pull request needs (UPG-15) while the
# pull request is a draft and the full CI is not needed. Removed before the
# pull request is marked ready.

on:
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  probe:
    name: Probe (UPG-15)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: go test
        run: go test ./internal/builder/nativetest -run 'TestMsiexecMovedFindRelatedProducts' -count=1 -v
