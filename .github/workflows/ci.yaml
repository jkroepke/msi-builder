name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions: {}

jobs:
  # Pull requests and pushes to main that only touch Markdown or docs/ skip
  # the Go jobs below. docs/cli is generated and checked by a test, and
  # docs/spec/msitest is Go code, so changes there still count. Tags and
  # workflow_dispatch always run every job.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.set-output.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: 'false'

      - id: set-output
        name: Detect changes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request runs on its merge commit, so its first parent is
          # the base it was built on. A push to main compares with the
          # commit main pointed to before the push.
          case "${EVENT}:${REF}" in
            pull_request:*) base=HEAD^1 ;;
            push:refs/heads/main) base="${BEFORE}" ;;
            *) base= ;;
          esac

          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "changed=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --no-renames "${base}" HEAD > "${RUNNER_TEMP}/files"
          code=$(grep -cEv '^docs/|\.md$' "${RUNNER_TEMP}/files" || true)
          generated=$(grep -cE '^docs/(cli|spec/msitest)/' "${RUNNER_TEMP}/files" || true)
          echo "changed=$((code + generated))" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.suite }})
    needs: detect-changes
    if: needs.detect-changes.outputs.changed != '0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The msiexec tests of nativetest install one package at a time and
        # set the length of a Windows run, so they get a runner of their own
        # (suite native) while the other packages run under -race on another
        # (suite unit).
        include:
          - { os: ubuntu-26.04, suite: unit }
          - { os: windows-latest, suite: unit }
          - { os: windows-latest, suite: native }
          # Only a few native tests, see go test (Windows on Arm).
          - { os: windows-11-arm, suite: arm }
    permissions:
      contents: read
      # Codecov upload without a token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - name: go build
        run: go build ./...

      # The full ICE suite (darice.cub) comes with MsiVal2 in the Windows SDK
      # and may not be redistributed, so it is installed here. winget checks
      # the SDK installer against the hash in its manifest; only the MSI
      # tools feature is installed, and it ships the MsiVal2 package. The
      # ICE runner needs nothing but darice.cub, so only that file is cached.
      - name: Cache the ICE suite
        if: matrix.suite == 'native'
        id: ice-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\ice
          key: ice-Microsoft.WindowsSDK.10.0.28000-10.0.28000.2526-v1

      - name: Install the ICE suite
        if: matrix.suite == 'native' && steps.ice-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Pin the manifest version and keep it in step with the cache key
          # above. The same manifest has still installed cubs with different
          # hashes (VAL-01 log).
          winget install --id Microsoft.WindowsSDK.10.0.28000 --version 10.0.28000.2526 --exact `
            --silent --disable-interactivity --accept-package-agreements --accept-source-agreements `
            --override '/features OptionId.MSIInstallTools /quiet /norestart'
          # 0x8A150061 (-1978335135): the pinned version is already installed.
          # The MsiVal2 search below still fails loudly if its feature is missing.
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335135) { throw "winget exited with $LASTEXITCODE" }
          # The runner ends a pwsh step with exit $LASTEXITCODE.
          $global:LASTEXITCODE = 0
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          # Prefer the pinned SDK's copy of the MsiVal2 package.
          $msi = Get-ChildItem -Path $kits -Recurse -Filter 'MsiVal2-x86_en-us.msi' |
            Sort-Object { $_.FullName -notlike '*28000*' } | Select-Object -First 1
          if (-not $msi) { throw "no MsiVal2-x86_en-us.msi under $kits" }
          Get-FileHash $msi.FullName -Algorithm SHA256 | Format-List
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart"
          if ($p.ExitCode -ne 0) { throw "MsiVal2 install exited with $($p.ExitCode)" }
          New-Item -ItemType Directory -Force C:\ice | Out-Null
          Copy-Item (Join-Path ${env:ProgramFiles(x86)} 'MsiVal2\darice.cub') C:\ice\darice.cub

      - name: Use the ICE suite
        if: matrix.suite == 'native'
        shell: pwsh
        run: |
          if (-not (Test-Path C:\ice\darice.cub)) { throw 'C:\ice\darice.cub is missing' }
          # The same pinned manifest has given cubs with different hashes, so
          # the hash is logged for the record but not enforced (VAL-01 log).
          Get-FileHash C:\ice\darice.cub -Algorithm SHA256 | Format-List
          'MSI_BUILDER_ICE_CUB=C:\ice\darice.cub' >> $env:GITHUB_ENV
          'MSI_BUILDER_ICE_REQUIRED=1' >> $env:GITHUB_ENV

      # TestMsiexecHarvestedComponentCodes (UPG-12) upgrades a package that
      # WiX built from a Files glob by the package msi-builder builds from the
      # converted source. WiX runs as a black box; Files needs WiX 5.
      - name: Install WiX
        if: matrix.suite == 'native'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:USERPROFILE '.dotnet\tools' >> $env:GITHUB_PATH
          'MSI_BUILDER_WIX_REQUIRED=1' >> $env:GITHUB_ENV

      # Install packages as a standard user too (MSISPEC-RESULTS INST-02,
      # PROP-01). The runner is thrown away after the job, so the step
      # creates a local user with a random password and allows non-admin
      # installs, which Windows Server turns off by default (DisableMsi).
      # The TestNonAdmin tests in go test below skip without the user.
      - name: Create a standard user
        if: matrix.suite == 'native'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [byte[]]::new(24)
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes) + 'aA1!'
          "::add-mask::$password"
          New-LocalUser -Name msitest -Password (ConvertTo-SecureString $password -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          if (-not (Test-Path $policy)) { New-Item $policy -Force | Out-Null }
          Set-ItemProperty $policy -Name DisableMsi -Value 0 -Type DWord
          'MSI_BUILDER_NONADMIN_USER=msitest' >> $env:GITHUB_ENV
          "MSI_BUILDER_NONADMIN_PASSWORD=$password" >> $env:GITHUB_ENV

      # Linux runs -short and uploads its coverage. Windows runs every package
      # but nativetest under -race. The builder code the native tests run is
      # checked for races here; only internal/ice's Windows code, which the
      # native tests call one at a time, runs without -race.
      - name: go test
        if: matrix.suite == 'unit'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            go test ./... -short -timeout 25m -shuffle=on -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./...
          else
            mapfile -t pkgs < <(go list ./... | grep -v '/internal/builder/nativetest$')
            go test "${pkgs[@]}" -timeout 25m -shuffle=on -race
          fi

      # The package readers once wrapped a 2 GiB string length into a
      # negative int on 32-bit builds and panicked; they run as 386 too.
      - name: go test (32-bit readers)
        if: matrix.suite == 'unit' && runner.os == 'Linux'
        env:
          GOARCH: '386'
        run: go test -short -shuffle=on ./internal/msidb/ ./internal/cfb/ ./internal/codepage/ ./internal/summary/ ./internal/cab/ ./internal/lzx/ ./pkg/sign/

      # The native tests open the built packages with msi.dll, run the ICE
      # suite and install them with msiexec; -short skips them. They run
      # without -race, which slows the in-process package builds while
      # msiexec waits. The run is verbose, so the job log holds what the result
      # tests print with t.Log (MSISPEC-RESULTS logs cite this step); a result
      # test needs no step of its own. The install snapshots that differ from
      # testdata are saved to MSI_BUILDER_SNAPSHOT_DIR and uploaded below.
      - name: go test (native)
        if: matrix.suite == 'native'
        shell: bash
        env:
          MSI_BUILDER_SNAPSHOT_DIR: ${{ runner.temp }}/install-snapshots
        run: go test ./internal/builder/nativetest/ -v -timeout 25m -shuffle=on

      # Windows on Arm installs the run action probe, the remembered install
      # folder package, the shortcut property package and the language
      # transform packages natively (Arm64 packages, the first with the arm64
      # DLL), and the x64 package that refuses Arm64 (PROP-03). msiexec is
      # slow on this runner, so the rest of the native suite stays on x64.
      - name: go test (Windows on Arm)
        if: matrix.suite == 'arm'
        shell: bash
        run: go test ./internal/cadll/ ./internal/builder/nativetest/ -run 'TestBinaries|TestMsiexecRunActions|TestMsiexecRememberInstallDir|TestMsiexecShortcutProperties|TestLanguagesInstallLANG03|TestFullUILanguages|TestMsiexecNativeArch' -v -timeout 20m -shuffle=on

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.suite == 'native'
        with:
          name: install-snapshots
          path: ${{ runner.temp }}/install-snapshots/
          if-no-files-found: ignore

      # The race detector slows the LZX encoder down about fifty times, so the
      # race run above shrinks the large LZX cases; run them at full size.
      - name: go test (LZX at full size)
        if: runner.os == 'Windows' && matrix.suite == 'unit'
        shell: bash
        run: |
          go test -count=1 ./internal/lzx/
          go test -count=1 -run 'TestNative(FDI|Expand)Extracts/lzx|TestNativeLZXSystemBinaries|TestLZX' ./internal/cab/
          go test -count=1 -run 'BoundedMemory' ./internal/cab/ ./internal/builder/
          go test -count=1 -v -run 'TestNativeFDIMaxFiles' ./internal/cab/

      # A package above 2 GB, its cabinets beside the .msi (MSISPEC section 5,
      # CAB-10). It writes about 9 GB, so it runs on its own and without
      # the race detector, on the unit runner, which finishes first.
      - name: go test (package above 2 GB)
        if: runner.os == 'Windows' && matrix.suite != 'native'
        shell: bash
        env:
          MSI_BUILDER_LARGE_PACKAGE: '1'
        run: go test -v -count=1 -timeout 30m -run 'TestMsiexecInstallsLargePackage' ./internal/builder/nativetest/

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: runner.os == 'Linux'
        with:
          use_oidc: true
          files: coverage.out

  goreleaser:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed != '0'
    runs-on: ubuntu-26.04
    name: Test goreleaser
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - name: Check for the CLI
        id: cli
        run: |
          if [ -d cmd/msi-builder ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::cmd/msi-builder does not exist yet, skipping the goreleaser snapshot."
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.cli.outputs.present == 'true'
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: steps.cli.outputs.present == 'true'

      - name: Set up Docker Buildx
        if: steps.cli.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: go build (with goreleaser)
        if: steps.cli.outputs.present == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: github=goreleaser/goreleaser
          version: v2.19.0
          args: release --snapshot
        env:
          GITHUB_TOKEN: ""

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.cli.outputs.present == 'true'
        with:
          name: dists
          path: dist/

  lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed != '0'
    name: lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: github=golangci/golangci-lint
          version: v2.15.0
          # Build golangci-lint with the Go version from go.mod. Release binaries
          # are built with an older Go and refuse to lint a newer go.mod.
          install-mode: goinstall
          args: "--max-same-issues=0"

  super-lint:
    name: super-lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MULTI_STATUS: false
          LINTER_RULES_PATH: .
          # The Windows test harness and its raw run logs.
          FILTER_REGEX_EXCLUDE: docs/spec/msitest/.*
          GITHUB_ACTIONS_ZIZMOR_CONFIG_FILE: ./.github/zizmor.yml
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GO_RELEASER: true
          VALIDATE_HTML: true
          VALIDATE_JSON: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_RENOVATE: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_SPELL_CODESPELL: true
          VALIDATE_XML: true
          VALIDATE_YAML: true

  # The custom action DLL of run actions (internal/cadll) is committed; this
  # rebuilds it with the pinned clang of Ubuntu 24.04 and fails when the
  # committed files differ, so every change to its source comes with a
  # rebuild and SHA256SUMS stays true.
  ca-dll:
    name: Custom action DLL
    needs: detect-changes
    if: needs.detect-changes.outputs.changed != '0'
    runs-on: ubuntu-26.04
    container: ubuntu:24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Install clang 18
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          clang-18 --version

      - name: Rebuild and compare
        env:
          CLANG: clang-18
          DLLTOOL: llvm-dlltool-18
        # SHA256SUMS pins the committed DLLs (TestBinaries checks the embedded
        # files against it) and build.sh rewrites it, so a rebuild that
        # leaves it unchanged is byte-identical. The container checkout has
        # no .git, hence the copy instead of git diff.
        run: |
          cp internal/cadll/SHA256SUMS /tmp/committed-SHA256SUMS
          internal/cadll/build.sh
          diff /tmp/committed-SHA256SUMS internal/cadll/SHA256SUMS

  # The one job to mark as required in branch protection. It only runs, and
  # fails, when a needed job failed or was cancelled; GitHub counts the
  # skipped job as passed. Add every new check job to needs, and to the
  # needs of release and publish, so that nothing is tagged or published
  # past a failed check.
  fail:
    name: fail
    if: "${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}"
    needs:
      - detect-changes
      - build
      - ca-dll
      - goreleaser
      - lint
      - super-lint
    runs-on: ubuntu-26.04
    steps:
      - name: verify checks passed
        run: |
          echo "Some checks have failed!"
          exit 1

  # Tags a new version from the conventional commit titles on main. A tag
  # created with GITHUB_TOKEN does not trigger the tag push run of CI, but a
  # workflow_dispatch does, so dispatch CI on the new tag like tag.yaml.
  #
  # Runs only while the repository variable RELEASE_ENABLED is 'true'
  # (Settings > Secrets and variables > Actions > Variables; the comparison
  # ignores case). Unset pauses automatic releases. The Create Tag workflow
  # still publishes a release by hand.
  release:
    if: vars.RELEASE_ENABLED == 'true' && github.repository_owner == 'jkroepke' && github.ref_name == 'main'
    name: Release
    runs-on: ubuntu-26.04
    environment: "Create Release Tag"
    concurrency: create-tag
    needs:
      - build
      - ca-dll
      - lint
      - goreleaser
      - super-lint
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: 'false'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Tags already on HEAD, so a re-run does not dispatch an old release again.
      - name: List existing tags
        id: before
        run: echo "tags=$(git tag --points-at HEAD --list 'v*' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The conventionalcommits preset understands the `feat!:` form that
        # CONTRIBUTING.md asks for; the default angular preset ignores it.
        run: npx -y -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release

      - name: Dispatch CI on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAGS_BEFORE: ${{ steps.before.outputs.tags }}
        run: |
          TAG=""
          for t in $(git tag --points-at HEAD --list 'v*'); do
            case " $TAGS_BEFORE " in
              *" $t "*) ;;
              *) TAG="$t" ;;
            esac
          done

          if [ -z "$TAG" ]; then
            echo "::notice::semantic-release created no tag."
            exit 0
          fi

          # If this fails, a re-run finds the tag already on HEAD and stops.
          # Publish it by hand: gh workflow run ci.yaml --ref <tag>
          gh workflow run ci.yaml --ref "$TAG"

  publish:
    name: Publish release
    environment: Publish
    # Tags created by the Create Tag workflow or the release job start this
    # workflow by workflow_dispatch.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - ca-dll
      - lint
      - goreleaser
      - super-lint
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: github=goreleaser/goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Publish Release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      # parse artifacts to the format required for image attestation
      # https://github.com/goreleaser/goreleaser/issues/4852#issuecomment-2122790132
      - run: |
          echo "digest=$(echo "$ARTIFACTS" | jq -r '[.[]|select(.type=="Docker Image")][0]|.extra.Digest')" | tee /dev/stderr >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$ARTIFACTS" | jq -r '[.[]|select(.type=="Docker Image")][0]|.name|split(":")[0]')" | tee /dev/stderr >> "$GITHUB_OUTPUT"
        id: image_metadata
        env:
          ARTIFACTS: ${{steps.goreleaser.outputs.artifacts}}

      # attest image
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{steps.image_metadata.outputs.digest}}
          subject-name: ${{steps.image_metadata.outputs.name}}
          push-to-registry: true
